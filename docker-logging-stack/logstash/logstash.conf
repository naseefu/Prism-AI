input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    remove_field => [ "event", "agent", "ecs" ]
  }
}

output {
  if [log_source] == "payments" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "payments-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_source] == "anhub" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "anhub-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "unclassified-logs-%{+YYYY.MM.dd}"
    }
  }

  stdout {
    codec => rubydebug
  }
}